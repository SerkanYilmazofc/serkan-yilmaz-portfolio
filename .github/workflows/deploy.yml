name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-static
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy files
        run: |
          mkdir -p /tmp/deploy-site
          cp -R dist/. /tmp/deploy-site/
          # PHP analytics API (copy without secrets)
          mkdir -p /tmp/deploy-site/api
          cp -R api/. /tmp/deploy-site/api/
          rm -f /tmp/deploy-site/api/.env
          # Root SPA + API hardening
          cat > /tmp/deploy-site/.htaccess <<'EOF'
          Options -Indexes

          <IfModule mod_authz_core.c>
            <FilesMatch "^\.env">
              Require all denied
            </FilesMatch>
          </IfModule>

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Never send /api to the SPA
            RewriteRule ^api/ - [L]

            # SPA fallback
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>
          EOF

      - name: Push to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/deploy-site
          publish_branch: deploy
          force_orphan: true
          commit_message: "Deploy production build + API"
